
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>독도 이행시 관리자</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f6fc;
  color: #19334f;
}
header {
  background: linear-gradient(120deg,#123b70,#1976a8);
  color: white;
  padding: 28px 20px;
  text-align: center;
}
header h1 { margin: 0 0 8px; }
header p { margin: 0; opacity: .85; }
.container {
  max-width: 1100px;
  margin: 25px auto;
  padding: 0 16px;
}
.panel {
  background: white;
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 20px;
  box-shadow: 0 4px 18px #163b6412;
}
h2 { margin-top: 0; }
input {
  width: 100%;
  padding: 13px;
  border: 1px solid #ccd8e5;
  border-radius: 9px;
  margin: 7px 0 13px;
  font-size: 15px;
}
button {
  border: 0;
  border-radius: 9px;
  padding: 11px 15px;
  background: #1769aa;
  color: white;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  margin: 3px;
}
button:hover { opacity: .88; }
button:disabled { opacity: .5; cursor: not-allowed; }
.logout { background: #66788a; }
.draw { background: #d18a20; }
.edit { background: #1769aa; }
.delete { background: #d94848; }
.cancel { background: #66788a; }
.status { color: #526b82; margin-top: 12px; }
.cards {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 14px;
}
.stat {
  background: #edf5fc;
  border-radius: 12px;
  padding: 18px;
}
.stat small { color: #60758a; }
.stat strong {
  display: block;
  font-size: 30px;
  margin-top: 8px;
}
.table-wrap { overflow-x: auto; }
table {
  width: 100%;
  border-collapse: collapse;
  min-width: 650px;
}
th,td {
  padding: 13px 10px;
  border-bottom: 1px solid #e6edf4;
  text-align: left;
}
th { background: #f3f7fb; }
.winner { color: #c17b13; font-weight: bold; }
.hidden { display: none !important; }
#result {
  background: #fff7e8;
  border-radius: 12px;
  padding: 18px;
  margin-top: 15px;
  text-align: center;
  font-size: 19px;
  font-weight: bold;
}
.edit-panel {
  border: 2px solid #d8e8f7;
  background: #f8fbff;
}
.edit-panel h2 { margin-bottom: 8px; }
.edit-panel label {
  display: block;
  font-weight: bold;
  margin-top: 10px;
}
.list-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
.list-heading h2 { margin: 0; }
.count-label {
  background: #edf5fc;
  color: #1769aa;
  padding: 7px 12px;
  border-radius: 20px;
  font-size: 14px;
  font-weight: bold;
}
.winner-count {
  background: #fff3df;
  color: #b87815;
}
.empty {
  text-align: center;
  color: #8092a3;
  padding: 24px;
}
@media(max-width:600px) {
  .cards { grid-template-columns: 1fr; }
  .panel { padding: 17px; }
}
</style>
</head>
<body>

<header>
  <h1>🇰🇷 독도 이행시 관리자</h1>
  <p>참가자 관리 및 당첨자 추첨</p>
</header>

<div class="container">

  <section class="panel" id="loginPanel">
    <h2>관리자 로그인</h2>
    <p>나라 찾기 관리자 계정으로 로그인하세요.</p>
    <input id="email" type="email" placeholder="관리자 이메일">
    <input id="password" type="password" placeholder="비밀번호">
    <button id="loginBtn" onclick="login()">로그인</button>
    <p class="status" id="loginStatus"></p>
  </section>

  <section id="dashboard" class="hidden">

    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
        <h2>관리자 대시보드</h2>
        <button class="logout" onclick="logout()">로그아웃</button>
      </div>
      <p>독도 이행시 참가자 현황</p>
      <button onclick="loadEntries()">새로고침</button>
    </div>

    <div class="panel">
      <div class="cards">
        <div class="stat">
          <small>전체 참가자</small>
          <strong id="totalCount">0명</strong>
        </div>
        <div class="stat">
          <small>추첨 완료</small>
          <strong id="drawnCount">0명</strong>
        </div>
        <div class="stat">
          <small>추첨 대기</small>
          <strong id="waitingCount">0명</strong>
        </div>
      </div>
    </div>

    <div class="panel">
      <h2>🎯 당첨자 추첨</h2>
      <p>아직 당첨되지 않은 참가자 중 한 명을 무작위로 추첨합니다.</p>
      <button class="draw" id="drawBtn" onclick="drawWinner()">당첨자 추첨하기</button>
      <div id="result" class="hidden"></div>
      <p class="status" id="drawStatus"></p>
    </div>

    <div class="panel edit-panel hidden" id="editPanel">
      <h2>✏️ 참가자 정보 수정</h2>
      <p>수정할 학번과 이름을 입력하세요.</p>

      <label for="editStudentId">학번</label>
      <input id="editStudentId" placeholder="학번 입력">

      <label for="editStudentName">이름</label>
      <input id="editStudentName" placeholder="이름 입력">

      <button id="saveEditBtn" onclick="saveEdit()">수정 내용 저장</button>
      <button class="cancel" onclick="cancelEdit()">취소</button>
      <p class="status" id="editStatus"></p>
    </div>

    <!-- 추첨 대기자 명단 -->
    <div class="panel">
      <div class="list-heading">
        <h2>⏳ 추첨 대기자</h2>
        <span class="count-label" id="waitingListCount">0명</span>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>번호</th>
              <th>학번</th>
              <th>이름</th>
              <th>등록 시간</th>
              <th>관리</th>
            </tr>
          </thead>
          <tbody id="waitingList">
            <tr><td colspan="5" class="empty">불러오는 중...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 당첨자 명단 -->
    <div class="panel">
      <div class="list-heading">
        <h2>🏆 당첨자 명단</h2>
        <span class="count-label winner-count" id="winnerListCount">0명</span>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>번호</th>
              <th>학번</th>
              <th>이름</th>
              <th>등록 시간</th>
              <th>상태</th>
              <th>관리</th>
            </tr>
          </thead>
          <tbody id="winnerList">
            <tr><td colspan="6" class="empty">불러오는 중...</td></tr>
          </tbody>
        </table>
      </div>
      <p class="status" id="listStatus"></p>
    </div>

  </section>
</div>

<script>
const SUPABASE_URL = "https://grjysehvlabnyenorkfp.supabase.co";
const SUPABASE_KEY = "sb_publishable_L-X2UFs2cCARxgd14Fw2IQ_4MAEePxJ";
const ADMIN_UID = "3b8ad1c7-6487-462a-984a-0788b88747cd";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const $ = id => document.getElementById(id);
let editingId = null;

function showDashboard() {
  $("loginPanel").classList.add("hidden");
  $("dashboard").classList.remove("hidden");
  loadEntries();
}

function showLogin() {
  $("dashboard").classList.add("hidden");
  $("editPanel").classList.add("hidden");
  $("loginPanel").classList.remove("hidden");
}

async function login() {
  const email = $("email").value.trim();
  const password = $("password").value;

  if (!email || !password) {
    $("loginStatus").textContent = "이메일과 비밀번호를 입력하세요.";
    return;
  }

  $("loginBtn").disabled = true;
  $("loginStatus").textContent = "로그인 중...";

  try {
    const { data, error } = await db.auth.signInWithPassword({
      email,
      password
    });

    if (error) throw error;

    if (!data.user || data.user.id !== ADMIN_UID) {
      await db.auth.signOut();
      throw new Error("관리자 계정이 아닙니다.");
    }

    $("loginStatus").textContent = "";
    showDashboard();

  } catch (error) {
    $("loginStatus").textContent = "로그인 실패: " + error.message;
  } finally {
    $("loginBtn").disabled = false;
  }
}

async function logout() {
  await db.auth.signOut();
  $("password").value = "";
  showLogin();
}

async function checkSession() {
  const { data, error } = await db.auth.getSession();

  if (error) {
    showLogin();
    return;
  }

  const user = data.session?.user;

  if (user && user.id === ADMIN_UID) {
    showDashboard();
  } else {
    if (user) await db.auth.signOut();
    showLogin();
  }
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function splitStudentInfo(info) {
  const value = (info || "").trim();
  const space = value.indexOf(" ");

  return {
    studentId: space === -1 ? value : value.slice(0, space),
    studentName: space === -1 ? "" : value.slice(space + 1)
  };
}

function makeEntryRow(entry, index, isWinner) {
  const info = splitStudentInfo(entry.student_info);
  const date = new Date(entry.created_at).toLocaleString("ko-KR");

  const editButton = `
    <button class="edit"
      data-action="edit"
      data-id="${escapeHTML(entry.id)}"
      data-student-id="${escapeHTML(info.studentId)}"
      data-student-name="${escapeHTML(info.studentName)}">
      수정
    </button>
  `;

  const deleteButton = isWinner
    ? '<button class="delete" disabled title="추첨된 학생은 삭제할 수 없습니다.">삭제 불가</button>'
    : `<button class="delete" data-action="delete" data-id="${escapeHTML(entry.id)}">삭제</button>`;

  if (isWinner) {
    return `
      <tr>
        <td>${index + 1}</td>
        <td>${escapeHTML(info.studentId)}</td>
        <td>${escapeHTML(info.studentName)}</td>
        <td>${escapeHTML(date)}</td>
        <td><span class="winner">🏆 당첨</span></td>
        <td>${editButton}${deleteButton}</td>
      </tr>
    `;
  }

  return `
    <tr>
      <td>${index + 1}</td>
      <td>${escapeHTML(info.studentId)}</td>
      <td>${escapeHTML(info.studentName)}</td>
      <td>${escapeHTML(date)}</td>
      <td>${editButton}${deleteButton}</td>
    </tr>
  `;
}

async function loadEntries() {
  $("listStatus").textContent = "참가자 정보를 불러오는 중...";
  $("waitingList").innerHTML =
    '<tr><td colspan="5" class="empty">불러오는 중...</td></tr>';
  $("winnerList").innerHTML =
    '<tr><td colspan="6" class="empty">불러오는 중...</td></tr>';

  const { data: userData } = await db.auth.getUser();

  if (!userData.user || userData.user.id !== ADMIN_UID) {
    showLogin();
    return;
  }

  const { data, error } = await db.rpc("dokdo_admin_list_entries");

  if (error) {
    $("listStatus").textContent = "조회 실패: " + error.message;
    $("waitingList").innerHTML =
      '<tr><td colspan="5" class="empty">정보를 불러오지 못했습니다.</td></tr>';
    $("winnerList").innerHTML =
      '<tr><td colspan="6" class="empty">정보를 불러오지 못했습니다.</td></tr>';
    return;
  }

  const entries = data || [];

  const winners = entries.filter(e => e.drawn_at);
  const waiting = entries.filter(e => !e.drawn_at);

  $("totalCount").textContent = entries.length + "명";
  $("drawnCount").textContent = winners.length + "명";
  $("waitingCount").textContent = waiting.length + "명";

  $("waitingListCount").textContent = waiting.length + "명";
  $("winnerListCount").textContent = winners.length + "명";

  // 추첨 대기자 표시
  if (waiting.length === 0) {
    $("waitingList").innerHTML =
      '<tr><td colspan="5" class="empty">추첨 대기자가 없습니다.</td></tr>';
  } else {
    $("waitingList").innerHTML = waiting.map((entry, index) =>
      makeEntryRow(entry, index, false)
    ).join("");
  }

  // 당첨자 표시
  if (winners.length === 0) {
    $("winnerList").innerHTML =
      '<tr><td colspan="6" class="empty">아직 당첨자가 없습니다.</td></tr>';
  } else {
    $("winnerList").innerHTML = winners.map((entry, index) =>
      makeEntryRow(entry, index, true)
    ).join("");
  }

  $("listStatus").textContent =
    "마지막 업데이트: " + new Date().toLocaleTimeString("ko-KR");
}

// 두 명단의 수정 및 삭제 버튼 처리
document.addEventListener("click", event => {
  const button = event.target.closest("button[data-action]");
  if (!button) return;

  const id = button.dataset.id;

  if (button.dataset.action === "edit") {
    startEdit(
      id,
      button.dataset.studentId,
      button.dataset.studentName
    );
  }

  if (button.dataset.action === "delete") {
    deleteEntry(id);
  }
});

function startEdit(id, studentId, studentName) {
  editingId = id;

  $("editStudentId").value = studentId || "";
  $("editStudentName").value = studentName || "";
  $("editStatus").textContent = "";

  $("editPanel").classList.remove("hidden");
  $("editPanel").scrollIntoView({
    behavior: "smooth",
    block: "center"
  });
}

function cancelEdit() {
  editingId = null;
  $("editPanel").classList.add("hidden");
  $("editStudentId").value = "";
  $("editStudentName").value = "";
  $("editStatus").textContent = "";
}

async function saveEdit() {
  if (!editingId) return;

  const studentId = $("editStudentId").value.trim();
  const studentName = $("editStudentName").value.trim();

  if (!studentId || !studentName) {
    $("editStatus").textContent = "학번과 이름을 모두 입력하세요.";
    return;
  }

  const studentInfo = studentId + " " + studentName;

  $("saveEditBtn").disabled = true;
  $("editStatus").textContent = "수정 중...";

  try {
    const { data: userData } = await db.auth.getUser();

    if (!userData.user || userData.user.id !== ADMIN_UID) {
      throw new Error("관리자 로그인이 필요합니다.");
    }

    const { error } = await db.rpc("dokdo_admin_update_entry", {
      p_id: editingId,
      p_student_info: studentInfo
    });

    if (error) throw error;

    alert("학생 정보가 수정되었습니다.");
    cancelEdit();
    await loadEntries();

  } catch (error) {
    $("editStatus").textContent = "수정 실패: " + error.message;
  } finally {
    $("saveEditBtn").disabled = false;
  }
}

async function deleteEntry(id) {
  if (!confirm("이 참가자를 정말 삭제할까요?\n삭제한 정보는 복구할 수 없습니다.")) {
    return;
  }

  try {
    const { data: userData } = await db.auth.getUser();

    if (!userData.user || userData.user.id !== ADMIN_UID) {
      throw new Error("관리자 로그인이 필요합니다.");
    }

    const { error } = await db.rpc("dokdo_admin_delete_entry", {
      p_id: id
    });

    if (error) throw error;

    alert("참가자가 삭제되었습니다.");
    await loadEntries();

  } catch (error) {
    alert("삭제 실패: " + error.message);
  }
}

async function drawWinner() {
  if (!confirm("당첨자를 추첨할까요? 추첨 결과는 되돌릴 수 없습니다.")) {
    return;
  }

  $("drawBtn").disabled = true;
  $("drawStatus").textContent = "추첨 중...";
  $("result").classList.add("hidden");

  try {
    const { data: userData } = await db.auth.getUser();

    if (!userData.user || userData.user.id !== ADMIN_UID) {
      throw new Error("관리자 로그인이 필요합니다.");
    }

    const { data, error } = await db.rpc("dokdo_draw_winner");

    if (error) throw error;

    if (!data || !data.length) {
      throw new Error("추첨 결과가 없습니다.");
    }

    const info = splitStudentInfo(data[0].student_info);

    $("result").innerHTML =
      "🎉 당첨자 발표 🎉<br><br>" +
      escapeHTML(info.studentId) + " " +
      escapeHTML(info.studentName);

    $("result").classList.remove("hidden");
    $("drawStatus").textContent = "추첨이 완료되었습니다.";

    // 추첨 후 대기자와 당첨자 명단 모두 새로고침
    await loadEntries();

  } catch (error) {
    $("drawStatus").textContent = "추첨 실패: " + error.message;
  } finally {
    $("drawBtn").disabled = false;
  }
}

db.auth.onAuthStateChange((event, session) => {
  if (event === "SIGNED_OUT") showLogin();
});

checkSession();
</script>

</body>
</html>
