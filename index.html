
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세계 국가 찾기 퀴즈</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;color:#172033;font-family:Arial,"Malgun Gothic",sans-serif}
header{background:#173b70;color:white;text-align:center;padding:18px;font-size:23px;font-weight:bold}
main{max-width:1100px;margin:22px auto;padding:14px}
.panel{background:white;border-radius:14px;padding:22px;margin-bottom:18px;box-shadow:0 3px 14px #0001}
input,button,select{font-size:16px;padding:12px;border-radius:8px}
input,select{width:100%;border:1px solid #cbd5e1;margin:7px 0 15px}
button{border:0;background:#2464b4;color:white;font-weight:bold;cursor:pointer}
button:hover{filter:brightness(.93)}
.hidden{display:none!important}
.levels{display:flex;gap:10px}
.levels button{flex:1}
#map{height:490px;background:#b9dce9;border-radius:12px}
.info{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:bold}
.question{text-align:center;font-size:27px;font-weight:bold;margin:18px}
#message{text-align:center;min-height:30px;font-weight:bold;margin:12px}
.small{font-size:13px;color:#64748b}
table{border-collapse:collapse;width:100%;margin-top:12px}
th,td{padding:9px;text-align:center;border-bottom:1px solid #e2e8f0}
th{background:#edf3fa}

/* 난이도별 등수 표시 */
.rank-badge{
 display:inline-block;
 font-size:11px;
 font-weight:bold;
 padding:4px 7px;
 border-radius:6px;
 white-space:nowrap;
}
.rank-1{
 background:#fee2e2;
 color:#dc2626;
}
.rank-2{
 background:#fef3c7;
 color:#a16207;
}
.rank-3{
 background:#dcfce7;
 color:#15803d;
}
</style>
</head>
<body>
<header>🌍 세계 국가 찾기 퀴즈</header>
<main>

<section id="start" class="panel">
<h2>게임 시작</h2>
<label>학번</label>
<input id="studentId" placeholder="학번 입력">
<label>이름</label>
<input id="studentName" placeholder="이름 입력">
<p>난이도를 선택하세요.</p>
<div class="levels">
<button onclick="startGame('하')">하</button>
<button onclick="startGame('중')">중</button>
<button onclick="startGame('상')">상</button>
</div>
<p class="small">제한 시간 60초 · 한 국가당 최대 3회 오답</p>
</section>

<section id="game" class="panel hidden">
<div class="info">
<span id="levelText"></span>
<span>남은 시간: <b id="timer">60</b>초</span>
<span>점수: <b id="score">0</b>점</span>
<span>문제: <b id="questionNumber">1</b></span>
</div>
<div id="question" class="question">국가를 찾으세요!</div>
<div id="map"></div>
<div id="message"></div>
<button style="width:100%" onclick="endGame()">게임 종료</button>
</section>

<section id="result" class="panel hidden">
<h2>게임 결과</h2>
<p id="resultText"></p>
<p id="saveMessage">점수를 저장하고 있습니다.</p>
<button onclick="location.reload()">처음으로</button>
</section>

<section class="panel">
<h2>🏆 통합 점수판</h2>
<label>난이도 선택</label>
<select id="boardLevel" onchange="loadScores()">
<option value="전체">전체</option>
<option value="하">하</option>
<option value="중">중</option>
<option value="상">상</option>
</select>
<button onclick="loadScores()">점수판 새로고침</button>
<div id="board">점수판을 불러오는 중...</div>
</section>

</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// Supabase 연결 정보
const SUPABASE_URL = "https://grjysehvlabnyenorkfp.supabase.co";
const SUPABASE_KEY = "sb_publishable_L-X2UFs2cCARxgd14Fw2IQ_4MAEePxJ";

// 국가 목록: ISO3 코드, 한국어 이름, 대륙, 난이도
const countries = [
["USA","미국","북아메리카","하"],["CAN","캐나다","북아메리카","하"],
["MEX","멕시코","북아메리카","하"],["BRA","브라질","남아메리카","하"],
["ARG","아르헨티나","남아메리카","하"],["CHL","칠레","남아메리카","하"],
["GBR","영국","유럽","하"],["FRA","프랑스","유럽","하"],
["DEU","독일","유럽","하"],["ESP","스페인","유럽","하"],
["ITA","이탈리아","유럽","하"],["RUS","러시아","유럽·아시아","하"],
["CHN","중국","아시아","하"],["IND","인도","아시아","하"],
["JPN","일본","아시아","하"],["KOR","대한민국","아시아","하"],
["AUS","오스트레일리아","오세아니아","하"],["NZL","뉴질랜드","오세아니아","하"],
["EGY","이집트","아프리카","하"],["ZAF","남아프리카공화국","아프리카","하"],
["NGA","나이지리아","아프리카","하"],["KEN","케냐","아프리카","하"],
["TUR","튀르키예","유럽·아시아","하"],["SAU","사우디아라비아","아시아","하"],
["IDN","인도네시아","아시아","하"],["THA","태국","아시아","하"],
["VNM","베트남","아시아","하"],["PAK","파키스탄","아시아","하"],
["UKR","우크라이나","유럽","하"],["POL","폴란드","유럽","하"],
["PRT","포르투갈","유럽","중"],["GRC","그리스","유럽","중"],
["SWE","스웨덴","유럽","중"],["NOR","노르웨이","유럽","중"],
["FIN","핀란드","유럽","중"],["AUT","오스트리아","유럽","중"],
["CHE","스위스","유럽","중"],["NLD","네덜란드","유럽","중"],
["BEL","벨기에","유럽","중"],["IRL","아일랜드","유럽","중"],
["DNK","덴마크","유럽","중"],["CZE","체코","유럽","중"],
["ROU","루마니아","유럽","중"],["HUN","헝가리","유럽","중"],
["SRB","세르비아","유럽","중"],["BGR","불가리아","유럽","중"],
["MAR","모로코","아프리카","중"],["DZA","알제리","아프리카","중"],
["TUN","튀니지","아프리카","중"],["LBY","리비아","아프리카","중"],
["SDN","수단","아프리카","중"],["ETH","에티오피아","아프리카","중"],
["TZA","탄자니아","아프리카","중"],["UGA","우간다","아프리카","중"],
["AGO","앙골라","아프리카","중"],["COD","콩고민주공화국","아프리카","중"],
["CIV","코트디부아르","아프리카","중"],["GHA","가나","아프리카","중"],
["SEN","세네갈","아프리카","중"],["COL","콜롬비아","남아메리카","중"],
["PER","페루","남아메리카","중"],["VEN","베네수엘라","남아메리카","중"],
["ECU","에콰도르","남아메리카","중"],["BOL","볼리비아","남아메리카","중"],
["URY","우루과이","남아메리카","중"],
["KAZ","카자흐스탄","아시아","상"],["UZB","우즈베키스탄","아시아","상"],
["TKM","투르크메니스탄","아시아","상"],["KGZ","키르기스스탄","아시아","상"],
["TJK","타지키스탄","아시아","상"],["AFG","아프가니스탄","아시아","상"],
["IRQ","이라크","아시아","상"],["SYR","시리아","아시아","상"],
["OMN","오만","아시아","상"],["YEM","예멘","아시아","상"],
["MMR","미얀마","아시아","상"],["LAO","라오스","아시아","상"],
["KHM","캄보디아","아시아","상"],["MYS","말레이시아","아시아","상"],
["PHL","필리핀","아시아","상"],["MNG","몽골","아시아","상"],
["NPL","네팔","아시아","상"],["BGD","방글라데시","아시아","상"],
["LKA","스리랑카","아시아","상"],["PNG","파푸아뉴기니","오세아니아","상"],
["MDG","마다가스카르","아프리카","상"],["MOZ","모잠비크","아프리카","상"],
["ZMB","잠비아","아프리카","상"],["ZWE","짐바브웨","아프리카","상"],
["NAM","나미비아","아프리카","상"],["BWA","보츠와나","아프리카","상"],
["GAB","가봉","아프리카","상"],["CMR","카메룬","아프리카","상"],
["TCD","차드","아프리카","상"],["NER","니제르","아프리카","상"],
["MLI","말리","아프리카","상"],["BFA","부르키나파소","아프리카","상"],
["MRT","모리타니","아프리카","상"],["GIN","기니","아프리카","상"],
["PRK","북한","아시아","상"]
];

let map, geoLayer, geoData;
let currentList=[], current=null, asked=new Set();
let wrong=0, score=0, remaining=60, timer=null;
let studentId="", studentName="", level="", finished=false;

function show(id){
 document.querySelectorAll("main>section").forEach(x=>x.classList.add("hidden"));
 document.getElementById(id).classList.remove("hidden");
}

function startGame(selected){
 studentId=document.getElementById("studentId").value.trim();
 studentName=document.getElementById("studentName").value.trim();

 if(!studentId||!studentName){
  alert("학번과 이름을 입력하세요.");
  return;
 }

 level=selected;
 currentList=countries.filter(c=>c[3]===level);
 asked.clear();
 score=0;
 remaining=60;
 finished=false;

 document.getElementById("score").textContent=score;
 document.getElementById("timer").textContent=remaining;
 document.getElementById("levelText").textContent="난이도: "+level;
 document.getElementById("questionNumber").textContent="1";

 show("game");
 initMap();
 nextQuestion();

 timer=setInterval(()=>{
  remaining--;
  document.getElementById("timer").textContent=remaining;
  if(remaining<=0)endGame();
 },1000);
}

function initMap(){
 if(map){map.remove();map=null;}

 map=L.map("map",{zoomControl:true,scrollWheelZoom:true}).setView([20,0],2);
 map.setMaxBounds([[-85,-180],[85,180]]);
 map.on("click",()=>{});

 fetch("https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson")
 .then(r=>{
  if(!r.ok)throw new Error("지도 데이터 오류");
  return r.json();
 })
 .then(data=>{
  geoData=data;
  geoLayer=L.geoJSON(data,{
   style:()=>({color:"#64748b",weight:1,fillColor:"#dce6ef",fillOpacity:.85}),
   onEachFeature:(feature,layer)=>{
    layer.on("click",()=>checkCountry(feature,layer));
   }
  }).addTo(map);

  map.fitWorld();
  nextQuestion();
 })
 .catch(()=>{
  document.getElementById("message").textContent="지도 데이터를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.";
 });
}

function getCode(feature){
 const p=feature.properties||{};
 return p["ISO3166-1-Alpha-3"]||p.ISO_A3_EH||p.ISO_A3||
 p.ADM0_A3||p.SOV_A3||p.ISO3||"";
}

function nextQuestion(){
 if(finished)return;

 const available=currentList.filter(c=>!asked.has(c[0]));

 if(available.length===0){
  endGame();
  return;
 }

 current=available[Math.floor(Math.random()*available.length)];
 asked.add(current[0]);
 wrong=0;

 document.getElementById("question").textContent=current[1]+"을(를) 지도에서 찾으세요!";
 document.getElementById("message").textContent="첫 번째 시도입니다.";
 document.getElementById("questionNumber").textContent=asked.size;

 resetMapStyle();
}

function resetMapStyle(){
 if(!geoLayer)return;

 geoLayer.eachLayer(layer=>{
  layer.setStyle({color:"#64748b",weight:1,fillColor:"#dce6ef",fillOpacity:.85});
 });
}

function checkCountry(feature,layer){
 if(finished||!current||!geoLayer)return;

 const code=getCode(feature);

 if(code===current[0]){
  const earned=wrong===0?3:wrong===1?2:1;
  score+=earned;

  document.getElementById("score").textContent=score;
  layer.setStyle({fillColor:"#16a34a",color:"#166534",weight:2,fillOpacity:.9});
  document.getElementById("message").textContent="정답! +"+earned+"점";

  current=null;
  setTimeout(nextQuestion,850);

 }else{
  wrong++;

  if(wrong===1){
   document.getElementById("message").textContent="틀렸어요! 다시 찾아보세요. (1/3)";
  }else if(wrong===2){
   document.getElementById("message").textContent="힌트! 이 국가는 "+current[2]+" 대륙에 있습니다. (2/3)";
  }else{
   document.getElementById("message").textContent="세 번 틀렸습니다. 정답은 "+current[1]+"입니다.";
   highlightAnswer();
   current=null;
   setTimeout(nextQuestion,1500);
  }
 }
}

function highlightAnswer(){
 if(!geoLayer||!current)return;

 geoLayer.eachLayer(layer=>{
  if(getCode(layer.feature)===current[0]){
   layer.setStyle({fillColor:"#16a34a",color:"#166534",weight:2,fillOpacity:.95});
  }
 });
}

async function endGame(){
 if(finished)return;

 finished=true;
 clearInterval(timer);

 document.getElementById("resultText").textContent=
 studentName+"님의 "+level+" 난이도 결과: "+score+"점";

 show("result");
 document.getElementById("saveMessage").textContent="점수를 저장하고 있습니다.";

 await saveScore();
 await loadScores();
}

async function saveScore(){
 if(!SUPABASE_KEY||SUPABASE_KEY==="YOUR_PUBLISHABLE_KEY"){
  document.getElementById("saveMessage").textContent="Supabase 공개 키를 입력해야 점수가 저장됩니다.";
  return;
 }

 try{
  const response=await fetch(SUPABASE_URL+"/rest/v1/game_scores",{
   method:"POST",
   headers:{
    "apikey":SUPABASE_KEY,
    "Authorization":"Bearer "+SUPABASE_KEY,
    "Content-Type":"application/json",
    "Prefer":"return=minimal"
   },
   body:JSON.stringify({
    student_id:studentId,
    student_name:studentName,
    difficulty:level,
    score:score
   })
  });

  if(!response.ok)throw new Error(await response.text());

  document.getElementById("saveMessage").textContent="점수가 성공적으로 저장되었습니다!";

 }catch(e){
  document.getElementById("saveMessage").textContent="점수 저장 실패: "+e.message;
 }
}

async function loadScores(){
 const board=document.getElementById("board");

 if(!SUPABASE_KEY||SUPABASE_KEY==="YOUR_PUBLISHABLE_KEY"){
  board.textContent="Supabase 공개 키를 입력한 뒤 점수판을 사용할 수 있습니다.";
  return;
 }

 board.textContent="점수판을 불러오는 중...";

 try{
  const response=await fetch(
   SUPABASE_URL+"/rest/v1/game_scores?select=student_id,student_name,difficulty,score,created_at&order=score.desc,created_at.asc&limit=100",
   {
    headers:{
     "apikey":SUPABASE_KEY,
     "Authorization":"Bearer "+SUPABASE_KEY
    }
   }
  );

  if(!response.ok){
   throw new Error("점수판을 불러오지 못했습니다: "+response.status);
  }

  let rows=await response.json();

  // 난이도별로 각각 순위를 계산
  const levels=["상","중","하"];

  levels.forEach(levelName=>{
   const levelRows=rows
    .filter(r=>r.difficulty===levelName)
    .sort((a,b)=>
     Number(b.score)-Number(a.score)||
     new Date(a.created_at)-new Date(b.created_at)
    );

   levelRows.forEach((r,index)=>{
    r.levelRank=index+1;
   });
  });

  const filter=document.getElementById("boardLevel").value;

  if(filter!=="전체"){
   rows=rows.filter(r=>r.difficulty===filter);
  }

  // 점수판 표시 순서는 점수 높은 순서
  rows.sort((a,b)=>
   Number(b.score)-Number(a.score)||
   new Date(a.created_at)-new Date(b.created_at)
  );

  if(!rows.length){
   board.textContent="아직 등록된 점수가 없습니다.";
   return;
  }

  board.innerHTML=
   "<table><thead><tr>"+
   "<th>순위</th><th>학번</th><th>이름</th>"+
   "<th>난이도</th><th>점수</th>"+
   "</tr></thead><tbody>"+

   rows.map(r=>{
    const rank=r.levelRank;
    let rankText;

    if(rank<=3){
     rankText=
      '<span class="rank-badge rank-'+rank+'">'+
      escapeHTML(r.difficulty)+" "+rank+"등!"+
      "</span>";
    }else{
     rankText=escapeHTML(r.difficulty)+" "+rank+"등";
    }

    return "<tr>"+
     "<td>"+rankText+"</td>"+
     "<td>"+escapeHTML(r.student_id)+"</td>"+
     "<td>"+escapeHTML(r.student_name)+"</td>"+
     "<td>"+escapeHTML(r.difficulty)+"</td>"+
     "<td>"+escapeHTML(r.score)+"점</td>"+
     "</tr>";
   }).join("")+

   "</tbody></table>";

 }catch(e){
  board.textContent=e.message;
 }
}

function escapeHTML(value){
 return String(value).replace(/[&<>"']/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[c]));
}

loadScores();
</script>
</body>
</html>
